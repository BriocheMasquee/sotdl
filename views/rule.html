{% extends "base.html" %}
{% block content %}
<main class="entity rule">
  <header class="entity-header">
    <div class="title-row">
      <h1 class="entity-title">{{ name }}</h1>
      {% if type %}<span class="entity-kind">{{ type|map: 'RuleType'|l }}</span>{% endif %}
    </div>
    {% if sourceFormatted %}<div class="entity-source">{% include "source.html" %}</div>{% endif %}
  </header>
  {% if descr %}<div class="description">{{ descr|md }}</div>{% endif %}
  {% if type == 'Source' and image %}<div class="entity-image"><a href="{{ image|resolvePath }}" target="_blank"><img src="{{ image|resolvePath }}" alt="{{ name }}"></a></div>{% endif %}
</main>
{{ runtime }}
{% endblock %}
