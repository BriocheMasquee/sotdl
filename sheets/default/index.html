<!doctype html>
<html lang="fr">
<!--
  Fiche de personnage interactive SotDL, style « Grimoire » (2026-11-20), d'après sotdl-rapports/maquette-fiche-pj-visuel.html.
  FICHIER GÉNÉRÉ par sotdl-system/outils/construire-fiche-grimoire.py à partir de outils/fiche-grimoire.modele.html :
  modifier le modèle, pas ce fichier.
  Adresse : /sheets/default/?id=<id-du-personnage> ; dans l'app (modale) et dans un navigateur (serveur web activé).
  Lit les valeurs calculées (views/transforms/character.json) ; n'écrit que des clés déclarées dans schemas/character.json.
  Compatibilité : le webview d'E+ est WebKit : aucun filtre SVG sur des éléments HTML (traits irréguliers = SVG pré-calculés).
  Doc : https://docs.encounter.plus/system-development/sheets/ (aperçu, interface non stable).
-->

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="Sheet.PageTitle"></title>
  <style>
    :root { color-scheme: light; --ink:#17120f; --blood:#8e0e14; --blood2:#b3151e; --bone:#efe8d8; --parch:#eee7d6; --line:#bdb7aa;

    /* page noire : l'app peint la zone sous sa barre avec la couleur de <html> ; le papier est sur la fiche seulement */

    body { background:#101010; color:var(--ink); font:14px/1.45 var(--f-ui); padding-top:8px; }
    button, input, select, textarea { font:inherit; color:inherit; }
    button { cursor:pointer; background:none; border:0; padding:0; }
    button:disabled, input:disabled, select:disabled, textarea:disabled { opacity:.45; cursor:not-allowed; }
    .app { position:relative; max-width:960px; min-height:calc(100vh - 8px); margin:0 auto; display:flex; flex-direction:column; overflow:hidden;
      background-color:#d9dde3; background-image:var(--paper,none); background-size:256px; border-top:5px solid var(--blood); box-shadow:0 0 0 1px #000, 0 0 24px #000a; }

    .lbl { font:700 9.5px var(--f-ui); letter-spacing:.14em; text-transform:uppercase; color:#5b5045; }
    .sub { color:#5b5045; font:11px var(--f-ui); }
    .empty { color:#6a5f52; font:italic 13px var(--f-body); margin:6px 0; }
    .error { color:var(--blood); font-weight:700; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .right { margin-left:auto; }
    /* ---- boutons ---- */
    .roll { display:inline-block; min-width:46px; padding:4px 12px; text-align:center; background:linear-gradient(180deg,var(--blood2),var(--blood)); color:var(--bone); font:700 15px/20px var(--f-ui); border-radius:6px 6px 14px 14px; box-shadow:0 2px 0 #000a, inset 0 1px 0 #ff9a9a55; letter-spacing:.03em; }
    .roll.dmg { background:linear-gradient(180deg,#2c231d,#0f0a08); }
    .roll.sm { min-width:42px; font-size:13px; padding:2px 10px; }
    .roll:hover:not(:disabled) { filter:brightness(1.15); }
    .plaque { display:inline-block; text-align:center; background:linear-gradient(180deg,#2c231d,#0f0a08); color:var(--bone); padding:4px 16px 5px; border-radius:5px 5px 14px 14px; box-shadow:0 2px 0 #000a, inset 0 1px 0 #ffffff22; min-width:84px; }
    .plaque b { display:block; font:700 15px/18px var(--f-ui); } .plaque em { display:block; font:italic 400 11px var(--f-body); color:#efe8d8; text-decoration:none; border:0; }
    .plaque:hover:not(:disabled) { filter:brightness(1.25); }
    .btn { display:inline-block; border:1.5px solid var(--blood); color:var(--blood); padding:4px 16px; border-radius:14px; font:700 12px var(--f-ui); background:#fff8; letter-spacing:.04em; }
    .btn.on { background:linear-gradient(180deg,var(--blood2),var(--blood)); color:var(--bone); box-shadow:0 2px 0 #000a; }
    .btn.big { padding:8px 26px; font-size:14px; }
    .btn:hover:not(:disabled) { filter:brightness(1.1); }
    .add { display:inline-block; border:1.5px dashed var(--blood); color:var(--blood); padding:3px 14px; border-radius:14px; font:700 12px var(--f-ui); background:#fff5; }
    .add:hover:not(:disabled) { background:var(--blood); color:var(--bone); }
    .seal2 { background:linear-gradient(180deg,var(--blood2),var(--blood)); color:var(--bone); font:700 11px var(--f-ui); letter-spacing:.08em; text-transform:uppercase; padding:4px 14px; border-radius:50px; box-shadow:0 2px 0 #000a, inset 0 1px 0 #ff9a9a55; }
    .del { width:22px; height:22px; border-radius:50%; background:var(--blood); color:var(--bone); font:700 12px/22px var(--f-ui); text-align:center; flex:none; }
    .pm { position:relative; width:32px; height:32px; border-radius:50%; background:#0b0807; border:1.5px solid #8b7b6b; color:var(--bone); font-size:0; line-height:0; flex:none; --pw:12px; --pt:2.4px; }
    /* signes − et + dessinés (le glyphe du texte se centre mal) : la barre horizontale est en ::before, la verticale (boutons +) en ::after */
    .pm::before, #hp-plus::after, .pm[data-d="1"]::after, .pm[data-e="1"]::after, .pm[data-md="1"]::after { content:''; position:absolute; left:50%; top:50%; background:currentColor; border-radius:1px; transform:translate(-50%,-50%); }
    .pm::before { width:var(--pw); height:var(--pt); } #hp-plus::after, .pm[data-d="1"]::after, .pm[data-e="1"]::after, .pm[data-md="1"]::after { width:var(--pt); height:var(--pw); }
    .pm.d { background:#fff8; border-color:#17120f66; color:var(--ink); width:28px; height:28px; --pw:11px; --pt:2.2px; }
    .pm:hover:not(:disabled) { border-color:var(--blood2); }
    .tg { width:42px; height:24px; border-radius:12px; background:#8a8174; position:relative; flex:none; box-shadow:inset 0 2px 4px #0006; }
    .tg i { position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:var(--bone); box-shadow:0 1px 3px #0008; transition:left .15s; }
    .tg.on { background:var(--blood); } .tg.on i { left:21px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px; align-items:center; }
    .chip { padding:4px 15px; border:1.5px solid var(--ink); border-radius:14px; font:700 11px var(--f-ui); letter-spacing:.1em; text-transform:uppercase; background:#fff8; color:var(--ink); }
    .chip.on { background:var(--ink); color:var(--bone); box-shadow:0 0 0 2px #fff8, 0 0 0 3.5px var(--blood); }
    .chip.tool { margin-left:auto; border-color:#8c8274; color:#5b5045; font-weight:600; text-transform:none; letter-spacing:0; }
    .chip .x { margin-left:6px; color:var(--blood2); }
    /* ---- bandeau d'en-tête ---- */
    .hero { position:relative; z-index:2; background:linear-gradient(180deg,#1f1813,#110c0a); color:var(--bone); padding:14px 30px 34px; overflow:hidden; }
    .hero::before { content:''; position:absolute; inset:0; background-image:var(--paper,none); background-size:256px; opacity:.09; mix-blend-mode:screen; }

      <button type="button" class="pm" id="hp-plus" data-ta="Sheet.HurtOne" data-tt="Sheet.HurtOne">+</button>
    </div>

  </div>
  <div class="band"><div class="sigs" id="attrs"></div><div class="chars" id="stats"></div></div>
  <div class="status" id="badges"></div>

  <div class="body">
    <section data-panel="act">
      <div class="cols2">
        <div><section class="box"><h3 class="ban"><span id="h-attacks"></span></h3><div id="attacks"></div></section>
          <section class="box"><h3 class="ban"><span id="h-rest"></span></h3>
          <div class="rest"><span class="nm"><span class="lk" id="rest-link" data-t="Sheet.Rest"></span><small data-t="Sheet.RestOnce"></small></span>
            <button type="button" class="plaque" id="rest-8"><b>8 h</b><em id="rest-8-sub"></em></button>
            <button type="button" class="plaque" id="rest-24"><b>24 h</b><em id="rest-24-sub"></em></button></div>
          <div class="rest med"><span class="nm"><small data-t="Sheet.Meditate"></small></span>
            <button type="button" class="tg on" id="rest-spells" role="switch" aria-checked="true" data-ta="Sheet.MeditateAria"><i></i></button></div>
          </section></div>
        <div><section class="box"><h3 class="ban"><span id="h-actions"></span></h3>
          <div id="actions"></div></section>
        <div class="addrow"><button type="button" class="chip tool" data-edit data-t="Sheet.Edit"></button><button type="button" class="add" id="add-action" data-t="Sheet.AddActionBtn"></button></div></div>
      </div>
    </section>

    <section data-panel="magic" hidden>
      <div class="chips" id="traditions"></div>
      <div class="rkgrid" id="spells"></div>
      <div class="addrow"><button type="button" class="chip tool" data-edit data-t="Sheet.Edit"></button><button type="button" class="add" id="add-spell" data-t="Sheet.AddSpellBtn"></button></div>
    </section>

    <section data-panel="talents" hidden>
      <div id="talents"></div>
      <div class="addrow"><button type="button" class="chip tool" data-edit data-t="Sheet.Edit"></button><button type="button" class="add" id="add-talent" data-t="Sheet.AddTalentBtn"></button></div>
    </section>

    <section data-panel="bag" hidden>
      <div class="coins" id="coins"></div>
      <div class="enc" id="enc"></div>
      <div class="cols2"><div id="items-eq"></div><div id="items-bag"></div></div>
      <div class="addrow"><button type="button" class="chip tool" data-edit data-t="Sheet.Edit"></button><button type="button" class="add" id="add-item" data-t="Sheet.AddItemBtn"></button></div>
      <section class="box"><h3 class="ban"><span id="h-notes"></span></h3><textarea class="lined" id="bag-notes"></textarea></section>
    </section>

    <section data-panel="perso" hidden>
      <div class="cols2">
        <div>
          <section class="box"><h3 class="ban"><span id="h-ident" data-t="Sheet.Identity"></span></h3><div id="identity"></div></section>
          <section class="box"><h3 class="ban"><span id="h-lp"></span></h3><div id="lp"></div></section>
          <section class="box"><h3 class="ban"><span id="h-transf"></span></h3><div id="transformation"></div></section>
        </div>
        <div>
          <section class="box"><h3 class="ban"><span id="h-hist"></span></h3><textarea class="lined big" id="history"></textarea></section>
          <section class="box"><h3 class="ban"><span id="h-comp"></span></h3><div id="complication"></div></section>
        </div>
      </div>
      <section class="box"><h3 class="ban"><span id="h-story"></span></h3><textarea class="lined big" id="story"></textarea></section>
      <section class="box"><h3 class="ban"><span id="h-calc" data-t="Sheet.Calcs"></span></h3><details class="calc"><summary data-t="Sheet.CalcSettings"></summary><div id="calc"></div></details></section>
      <div class="addrow"><button type="button" class="chip tool" data-edit data-t="Sheet.Edit"></button></div>
    </section>
  </div>

  <div class="status-msg" id="status"></div>
  <nav class="nav" id="tabs" role="tablist"></nav>
</div>
<div id="overlay" hidden></div>
<p id="loading" style="padding:16px;color:#d8d2c6" data-t="Sheet.Loading"></p>

<script src="/_app/js/ep.js"></script>
<!-- navigateur : fenêtre de bibliothèque et bandeau de résultat des jets -->
<script src="/_app/js/ep-ui.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id)
  const t = key => EP.t(key)
  const signed = (n) => (n >= 0 ? '+' : '') + n
  const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  const text = (el, v) => { if (el.textContent !== String(v)) el.textContent = v }
  const at = (obj, dotted) => dotted.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj)
  const box = (title, body, cls) => `<section class="box${cls ? ' ' + cls : ''}"><h3 class="ban"><span>${esc(title)}</span></h3>${body}</section>`
  const ICONS = {
    sword: '<path d="M20 4l-1 5-9 9-4-4 9-9z"/><path d="M7 13l4 4M6 18l-3 3"/>',
    flame: '<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
    star: '<path d="M12 3l2.6 6.2 6.4.5-4.9 4.2 1.6 6.3L12 16.9 6.3 20.2l1.6-6.3L3 9.7l6.4-.5z"/>',
    pouch: '<path d="M9 6l-1-2h8l-1 2c3 2 4 5 4 8 0 3-2 5-4 5H9c-2 0-4-2-4-5 0-3 1-6 4-8z"/><path d="M9 6h6"/>',
    person: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-8 8-8s8 3 8 8"/>',
    bow: '<path d="M6 3c9 4 9 14 0 18"/><path d="M6 3v18M6 12h14M16.5 8.5L20 12l-3.5 3.5"/>',
    shield: '<path d="M12 3l7 3v6c0 5-3 8-7 9-4-1-7-4-7-9V6z"/><path d="M12 7v10"/>',
  }
  const ic = (name, size = 26) => `<svg class="ic" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`

  // icône d'une arme ou d'une armure : épée (corps à corps), arc (distance), bouclier (armure, bouclier)
  const iconOf = (x) => (x.itemType === 'Armor' || x.weaponType === 'Shield' ? 'shield' : x.weaponType === 'Ranged' ? 'bow' : 'sword')
  const hero = EP.entity
  // « Voir la règle », liens d'entités : dans le navigateur (client web), on ouvre un NOUVEL ONGLET pour ne pas quitter la feuille ; dans l'application, ouverture normale d'Encounter+
  const epOpen = (ref) => { if (hero.client === 'browser' && typeof ref === 'string' && ref.startsWith('/')) { const w = window.open(ref, '_blank', 'noopener'); if (w) return } EP.open(ref) }
  if (!hero) { $('loading').textContent = t('Sheet.NoCharacter'); return }
  try { await hero.connect() }
  catch (e) { $('loading').textContent = t('Sheet.ConnectFail') + ' ' + (e.message || e); return }

  const status = $('status')
  const toast = (m) => {
    const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'alert'); el.textContent = m
    document.body.appendChild(el); setTimeout(() => el.remove(), 9000); el.addEventListener('click', () => el.remove())
  }
  const fail = (e) => {
    const m = (e && e.errors && e.errors.map((x) => x.message).join(' ; ')) || (e && e.message) || String(e)
    status.innerHTML = '<span class="error">' + esc(t('Sheet.Refused')) + ' ' + esc(m) + '</span>'
    toast(t('Sheet.Error').replace('{m}', m))
  }
  const note = (m) => { status.textContent = m; setTimeout(() => { if (status.textContent === m) status.textContent = '' }, 4000) }
  hero.addEventListener('error', (ev) => fail({ errors: ev.detail.errors }))
  hero.addEventListener('deleted', () => { status.textContent = t('Sheet.Deleted') })

  // ---- état de l'interface ----
  const ui = { tab: 'act', edit: false, trad: 'all', drawer: false }
  let last = null // dernier instantané
  const online = () => !last || last.status === 'connected'
  const off = () => (online() ? '' : ' disabled')

  const sysURL = (hero.env && hero.env.systemURL) || '/systems/sotdl/'
  document.documentElement.style.setProperty('--paper', `url('${sysURL}images/sotdl_paper.png')`)
  // portrait : toucher l'image l'affiche en grand
  document.querySelector('.portrait').addEventListener('click', () => {
    const src = $('portrait').getAttribute('src'); if (!src) return
    const ov = $('overlay')
    ov.innerHTML = `<div class="veil"></div><div class="dlg lbx" role="dialog" aria-label="${esc(hero.view.name || '')}"><img src="${esc(src)}" alt=""></div>`
    ov.hidden = false
    const close = () => { ov.hidden = true; ov.innerHTML = '' }
    ov.querySelector('.veil').addEventListener('click', close); ov.querySelector('.lbx').addEventListener('click', close)
  })
  document.title = hero.view.name || t('Sheet.PageTitle')

  // ---- fenêtres ----
  // dialog(titre, corps HTML, boutons) : résout { value, data } ; value = null si fermé en touchant le fond
  function dialog(title, body, buttons, onOpen, oneRow) {
    return new Promise((resolve) => {
      const ov = $('overlay')
      ov.innerHTML = `<div class="veil"></div><div class="dlg${oneRow ? ' wide' : ''}" role="dialog" aria-label="${esc(title)}"><h3 class="ban"><span>${esc(title)}</span></h3><div class="db">${body}</div>
        <div class="dbt${oneRow ? ' one' : ''}">${buttons.map((b, i) => `<button type="button" class="btn${b.primary ? ' on' : ''}" data-b="${i}">${esc(b.label)}${b.sub ? `<small class="bsub">${esc(b.sub)}</small>` : ''}</button>`).join('')}</div></div>`
      ov.hidden = false
      const close = (value) => {
        const data = {}
        ov.querySelectorAll('input,select,textarea').forEach((el) => { if (el.type === 'radio') { if (el.checked) data[el.name] = el.value } else data[el.name || el.id] = el.type === 'checkbox' ? el.checked : el.value })
        ov.hidden = true; ov.innerHTML = ''
        resolve({ value, data })
      }
      ov.querySelector('.veil').addEventListener('click', () => close(null))
      ov.querySelectorAll('button[data-b]').forEach((b) => b.addEventListener('click', () => close(buttons[Number(b.dataset.b)].value)))
      ov.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => close(b.dataset.close)))
      if (onOpen) onOpen(ov)
      const f = ov.querySelector('input:not([type=checkbox]):not([type=radio]),textarea'); if (f) f.focus()
    })
  }
  // confirmation aux couleurs de la fiche (remplace la boîte du système)
  async function ask(msg, o = {}) {
    const r = await dialog(o.title || t('Sheet.Confirm'), `<p>${esc(msg)}</p>`, [{ label: t('Sheet.Cancel'), value: null }, { label: o.action || t('Sheet.Ok'), value: 'ok', primary: true }])
    return r.value === 'ok'
  }

  // ---- sélecteur de la bibliothèque aux couleurs de la fiche (remplace celui de l'app) ----
  async function pickEntries(entity, title, opts = {}) {
    const picked = new Map()
    let entries = []
    const trads = opts.knownTraditions ? (hero.get('data.traditions') || []) : null
    const tradOf = (e) => { const x = (e.data && e.data.spellTradition) || e['data.spellTradition'] || e.spellTradition; return x && x.tradition }
    const shown = (ov) => { const only = trads && ov.querySelector('#pknown') && ov.querySelector('#pknown').checked; const base = opts.filter ? entries.filter(opts.filter) : entries; return only ? base.filter((e) => !tradOf(e) || trads.includes(tradOf(e))) : base }
    const draw = (ov, total) => {
      const box = ov.querySelector('#plist'), list = shown(ov)
      box.innerHTML = list.length ? list.map((e) => `<label class="opt pk"><input type="checkbox" data-id="${esc(e.id)}"${picked.has(e.id) ? ' checked' : ''}><span><b>${esc(e.name)}</b>${e.detail ? `<small>${esc(e.detail)}</small>` : ''}</span></label>`).join('') : `<p class="empty">${esc(t('Sheet.NoResults'))}</p>`
      ov.querySelector('#pinfo').textContent = total > entries.length ? tf('Sheet.PickMore', { n: entries.length, total }) : ''
      box.querySelectorAll('input').forEach((cb) => cb.addEventListener('change', () => { const e = list.find((x) => x.id === cb.dataset.id); if (cb.checked) { if (opts.single) { picked.clear(); box.querySelectorAll('input').forEach((o) => { if (o !== cb) o.checked = false }) } picked.set(e.id, e) } else picked.delete(e.id) }))
    }
    let timer = null
    const search = async (ov, q) => {
      try { const lim = trads || opts.filter ? 200 : 60, keys = opts.keys || (trads ? ['data.spellTradition'] : undefined); let r = await EP.query({ entity, search: q || undefined, where: opts.where, sort: 'name', limit: lim, keys }); if (!(r.entries || []).length && opts.where) r = await EP.query({ entity, search: q || undefined, sort: 'name', limit: lim, keys }); entries = r.entries || []; draw(ov, r.total || entries.length) }
      catch (e) { ov.querySelector('#plist').innerHTML = `<p class="empty">${esc(t('Sheet.LibUnavailable'))}</p>` }
    }
    const r = await dialog(title, '<input type="text" id="psearch" placeholder="' + esc(t('Sheet.Search')) + '" autocomplete="off">' + (trads ? `<label class="opt"><input type="checkbox" id="pknown" checked><span><b>${esc(t('Sheet.Step.Known'))}</b></span></label>` : '') + '<div class="picklist tall" id="plist"><p class="empty">' + esc(t('Sheet.Loading')) + '</p></div><p class="sub" id="pinfo"></p>',
      [{ label: t('Sheet.Cancel'), value: null }, { label: opts.action || t('Sheet.Add'), value: 'ok', primary: true }],
      (ov) => { search(ov, ''); const kn = ov.querySelector('#pknown'); if (kn) kn.addEventListener('change', () => draw(ov, 0)); ov.querySelector('#psearch').addEventListener('input', (e) => { clearTimeout(timer); timer = setTimeout(() => search(ov, e.target.value.trim()), 250) }) })
    return r.value === 'ok' ? [...picked.values()] : []
  }

  // ---- onglets du bas ----
  const TABS = [['act', t('Sheet.Tab.Act'), 'sword'], ['magic', t('Sheet.Tab.Magic'), 'flame'], ['talents', t('Sheet.Tab.Talents'), 'star'], ['bag', t('Sheet.Tab.Bag'), 'pouch'], ['perso', t('Sheet.Tab.Perso'), 'person']]
  $('tabs').innerHTML = TABS.map(([k, l, i]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === 'act'}">${ic(i)}<em>${l}</em></button>`).join('')
  function showTab(tab) {
    ui.tab = tab
    document.querySelectorAll('#tabs button').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.tab === tab)))
    document.querySelectorAll('[data-panel]').forEach((x) => { x.hidden = x.dataset.panel !== tab })
    window.scrollTo(0, 0)
  }
  $('tabs').addEventListener('click', (ev) => { const b = ev.target.closest('button[data-tab]'); if (b) showTab(b.dataset.tab) })
  document.addEventListener('click', (ev) => { if (ev.target.closest('[data-edit]')) { ui.edit = !ui.edit; rerender() } })
  const rerender = () => { keys = {}; if (last) render(last) }
  const editLabel = () => (ui.edit ? t('Sheet.EditDone') : t('Sheet.Edit'))

  // ---- champs liés ----
  EP.field($('name'), { store: hero, path: 'name' })
  EP.field($('history'), { store: hero, path: 'data.history' })
  EP.field($('story'), { store: hero, path: 'data.story' })
  EP.field($('bag-notes'), { store: hero, path: 'data.bagNotes' })
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t) })
  document.querySelectorAll('[data-tt]').forEach((el) => el.setAttribute('title', t(el.dataset.tt)))
  document.querySelectorAll('[data-ta]').forEach((el) => el.setAttribute('aria-label', t(el.dataset.ta)))
  document.title = t('Sheet.PageTitle')
  $('h-attacks').textContent = t('Character.Attacks')
  $('h-actions').textContent = t('Character.SecActions')
  $('h-rest').textContent = t('Sheet.RestTitle')
  $('h-story').textContent = t('Character.Story'); $('story').setAttribute('aria-label', $('h-story').textContent); $('h-notes').textContent = t('Character.BagNotes'); $('bag-notes').setAttribute('aria-label', $('h-notes').textContent)
  $('h-hist').textContent = t('Character.HistoryAppearance'); $('history').setAttribute('aria-label', $('h-hist').textContent)
  $('h-transf').textContent = t('Entity.Transformation'); $('h-comp').textContent = t('Entity.Complication'); $('h-lp').textContent = t('Common.Language&Profession')

  // ---- jets : d20 + modificateur ; avantage / désavantage au clic droit ou à l'appui long (menu) ----
  // dés nommés (config.json `dice.labels`) : le d20 est « Test » ou « Attaque », les d6 « Avantage » / « Désavantage » ; `kh1` : on garde le d6 le plus haut
  const edgeTermOf = (n) => (n ? (n > 0 ? '+' : '-') + Math.abs(n) + 'd6kh1[' + (n > 0 ? t('Sheet.Edge.Adv') : t('Sheet.Edge.Dis')) + ']' : '')
  // encombré (charge > Force ; au-delà du double la charge est impossible) : tous les jets de Force et d'Agilité se font avec 1 désavantage de plus (livre de règles, p. 99)
  const encumbered = () => { const str = Number(hero.get('view.data.strength') ?? 0), tot = Number(hero.get('view.data.encumbrance.total') ?? 0); return str > 0 && tot > str }
  const tagDice = (f, key) => String(f).replace(/(\d*d\d+(?:k[hl]\d+|x\d+)?)/gi, '$1[' + t(key) + ']')   // dés nommés (config.json dice.labels) : « Destinée », « Générique »
  const dmgFormula = (f) => String(f).replace(/(\d*d\d+(?:k[hl]\d+|x\d+)?)(?![\d\[])/gi, '$1[' + t('Sheet.Die.Damage') + ']')   // un dé déjà nommé (« 1d6[Destinée] ») garde son nom
  async function doRoll(spec, edge = 0, mode) {
    if (spec.raw) { try { return await EP.roll(spec.raw, { label: spec.label, type: spec.type }) } catch (e) { fail(e); return null } }
    if ((spec.attr === 'STR' || spec.attr === 'AGI') && encumbered()) { edge -= 1; note(t('Sheet.EncBane')) }
    const attack = spec.kind === 'attack'
    const formula = 'd20[' + (attack ? t('Sheet.Die.Attack') : (spec.die || t('Sheet.Die.Test'))) + ']' + (spec.mod ? signed(spec.mod) : '') + edgeTermOf(edge)
    const opts = { label: spec.label, type: attack ? 'attack' : 'check' }
    if (mode) opts.mode = mode
    let r = null
    try { r = await EP.roll(formula, opts) } catch (e) { fail(e); return null }
    // munition : chaque jet d'attaque en retire une (case cochée), si le jet a eu lieu
    if (r !== null && spec.ammo) hero.increment(spec.ammo, 1).catch(fail)
    return r
  }
  const attrName = (a) => (a[0] === 'PER' ? t('Characteristics.Perception') : t('Attributes.' + a[0]))
  // spec d'un bouton de jet : data-rs = « a:STR » (attribut), « w:1 » (arme), « x:2 » (action)
  function specOf(id) {
    const [k, v] = id.split(':')
    if (k === 'a') { const a = ATTR.find((x) => x[0] === v); return { attr: v, label: a[3], die: attrName(a), mod: Number(hero.get('view.data.' + a[2]) || 0), kind: 'check' } }
    if (k === 'l') { const sp = linkSpecs[Number(v)]; return sp.raw ? sp : termsSpec(sp) }
    const w = weapons[Number(v)]; const m = /^data\.items\.(\d+)$/.exec(w.ammoPath || '')
    return { attr: w.weaponType === 'Ranged' ? 'AGI' : 'STR', label: w.name, mod: Number(w.attackBonus ?? 0), kind: 'attack', ammo: m && Number(w.ammoUses ?? 0) - Number(w.ammoSpent ?? 0) > 0 ? `data.items[${m[1]}].usesSpent` : null }
  }
  // clic droit / appui long sur une pastille de jet : fenêtre où l'on règle le nombre de dés d'avantage ou de désavantage
  async function openMenu(x, y, id) {
    if ($('overlay').querySelector('.dlg')) return
    const spec = specOf(id)
    if (spec.raw) return
    const body = `<div class="step"><span class="nm" id="ed-l"></span><button type="button" class="pm d" data-e="-1" aria-label="−1">−</button><b id="ed-n">0</b><button type="button" class="pm d" data-e="1" aria-label="+1">+</button></div>
      <input type="hidden" id="edge" value="0"><label class="opt"><input type="checkbox" id="priv"><span><b>${esc(t('Sheet.Roll.Private'))}</b></span></label>`
    const show = (ov) => {
      const n = Number(ov.querySelector('#edge').value)
      ov.querySelector('#ed-n').textContent = n > 0 ? '+' + n : String(n)
      ov.querySelector('#ed-l').textContent = n === 0 ? t('Sheet.Edge.None') : n > 0 ? t('Sheet.Edge.Adv') + ' (d6)' : t('Sheet.Edge.Dis') + ' (d6)'
    }
    const r = await dialog(spec.label + ' ' + signed(spec.mod), body, [{ label: t('Sheet.Cancel'), value: null }, { label: t('Sheet.Roll.Go'), value: 'ok', primary: true }], (ov) => {
      show(ov)
      ov.querySelectorAll('button[data-e]').forEach((b) => b.addEventListener('click', () => {
        const e = ov.querySelector('#edge'); e.value = Math.max(-9, Math.min(9, Number(e.value) + Number(b.dataset.e))); show(ov)
      }))
    })
    if (r.value === 'ok') doRoll(spec, Number(r.data.edge) || 0, r.data.priv ? 'private' : undefined)
  }
  document.addEventListener('click', (ev) => {
    const b = ev.target.closest('button.roll[data-rs]')
    if (!b) return
    if (b.dataset.lp) { delete b.dataset.lp; return }
    doRoll(specOf(b.dataset.rs))
  })
  document.addEventListener('contextmenu', (ev) => { const b = ev.target.closest('button.roll[data-rs]'); if (!b) return; ev.preventDefault(); openMenu(ev.clientX, ev.clientY, b.dataset.rs) })
  // appui long (0,5 s) à la souris comme au doigt : ouvre la fenêtre d'avantages ; le clic qui suit est ignoré
  let lpTimer = null
  document.addEventListener('pointerdown', (ev) => {
    const b = ev.target.closest('button.roll[data-rs]'); if (!b || (ev.pointerType === 'mouse' && ev.button !== 0)) return
    clearTimeout(lpTimer); delete b.dataset.lp
    lpTimer = setTimeout(() => { lpTimer = null; b.dataset.lp = '1'; openMenu(ev.clientX, ev.clientY, b.dataset.rs) }, 500)
  })
  for (const n of ['pointerup', 'pointermove', 'pointercancel', 'pointerleave']) document.addEventListener(n, (ev) => { if (lpTimer && !(n === 'pointermove' && Math.abs(ev.movementX) + Math.abs(ev.movementY) < 4)) { clearTimeout(lpTimer); lpTimer = null } }, true)

  // ---- règles et fiches de la bibliothèque ----
  async function openRule(name) {
    try {
      const r = await EP.query({ entity: 'Rule', search: name, limit: 10 })
      const list = r.entries || []
      const e = list.find((x) => x.name.toLowerCase() === name.toLowerCase()) || list[0]
      if (e) epOpen(e.reference); else note(tf('Sheet.RuleMissing', { n: name }))
    } catch (err) { fail(err) }
  }
  const openRef = (ref, name) => { if (!ref) openRule(name); else if (String(ref).startsWith('/')) epOpen(ref); else toast(t('Sheet.RefInvalid')) }

  // ---- cases : utilisations dépensées (cases jusqu'à 10, compteur au-delà) ----
  // accordéon « bandeau » (actions, sorts, talents) : bandeau sombre (niveau, nom, cases d'utilisation, rond + / −) ; le texte se déplie dans un panneau clair
  function bandRow({ k, name, meta, level, uses, body, del }) {
    return `<div class="bdr"><details class="bd" data-k="${esc(k)}"${openSet.has(k) ? ' open' : ''}><summary>${level != null ? `<span class="lvb">${esc(level)}</span>` : ''}<span class="tn">${esc(name)}${meta ? `<small>${esc(meta)}</small>` : ''}</span>${uses ? `<span class="bu">${uses}</span>` : ''}</summary><div class="bdb">${body}</div></details>${del || ''}</div>`
  }
  function usesHTML(total, spent, path, label, maxPips = 5) {
    total = Number(total || 0); spent = Math.min(total, Number(spent || 0))
    if (total <= 0) return ''
    const d = off()
    if (total <= maxPips) return `<span class="pips" role="group" aria-label="${esc(label || t('Sheet.Uses'))}">` +
      Array.from({ length: total }, (_, k) => `<button type="button" class="pip${k < spent ? ' u' : ''}" data-use="${esc(path)}" data-i="${k}" data-spent="${spent}" aria-label="case ${k + 1}"${d}></button>`).join('') + '</span>'
    return `<button type="button" class="cnt" data-count="${esc(path)}" data-total="${total}" data-spent="${spent}"${d}><b>${total - spent}</b> / ${total}<span class="gauge"><i style="width:${Math.round(100 * (total - spent) / total)}%"></i></span></button>`
  }
  document.addEventListener('click', async (ev) => {
    const p = ev.target.closest('button[data-use]')
    if (p) {
      const i = Number(p.dataset.i), spent = Number(p.dataset.spent)
      try { await hero.set(p.dataset.use, i < spent ? i : i + 1) } catch (e) { fail(e) }
      return
    }
    const c = ev.target.closest('button[data-count]')
    if (c) {
      const total = Number(c.dataset.total), spent = Number(c.dataset.spent)
      const r = await dialog(t('Sheet.UsesLeft'), `<label class="lbl" for="rem">${esc(tf('Sheet.UsesLeftLbl', { n: total }))}</label><input type="number" id="rem" min="0" max="${total}" value="${total - spent}">`,
        [{ label: t('Sheet.Cancel'), value: null }, { label: t('Sheet.Step.Validate'), value: 'ok', primary: true }])
      if (r.value !== 'ok') return
      const rem = Math.max(0, Math.min(total, Number(r.data.rem)))
      if (Number.isFinite(rem)) hero.set(c.dataset.count, total - rem).catch(fail)
    }
  })

  // ===== EN-TÊTE =====
  const ATTR = [['STR', 'strength', 'strengthModifier', t('Attributes.STR')], ['AGI', 'agility', 'agilityModifier', t('Attributes.AGI')], ['INT', 'intellect', 'intellectModifier', t('Attributes.INT')],
    ['WIL', 'will', 'willModifier', t('Attributes.WIL')], ['PER', 'perceptionFinal', 'perceptionModifier', t('Characteristics.Perception')]]
  $('attrs').innerHTML = ATTR.map(([k, , , name]) => `<div class="sig"><span class="nm">${esc(k === 'PER' ? t('Characteristics.Perception') : t('Attributes.' + k))}</span><span class="ring"><b data-v="${k}">—</b></span><button type="button" class="roll" data-rs="a:${k}" data-roll="${k}" title="${esc(t('Sheet.ToHitTip'))}">—</button></div>`).join('')
  // niveaux déjà affichés dans la fenêtre ouverte : ils y restent même une fois leurs choix faits (sinon impossible de revenir sur le choix)
  let drawerSeen = new Set()
  $('level-btn').addEventListener('click', () => { drawerSeen.clear(); ui.drawer = true; renderDrawer() })

  const hpMax = () => hero.get('view.data.hp.maximum')
  const hpCur = () => Number(hero.get('view.data.hp.current') ?? 0)
  $('hp-minus').addEventListener('click', () => hero.set('data.hp.current', Math.max(0, hpCur() - 1)).catch(fail))
  $('hp-plus').addEventListener('click', () => { const m = hpMax(); if (m != null && hpCur() >= m) return; hero.set('data.hp.current', hpCur() + 1).catch(fail) })
  $('hp-open').addEventListener('click', async () => {
    const r = await dialog(t('Characteristics.Damage'), `<label class="lbl" for="amt">${esc(t('Character.Quantity'))}</label><input type="number" id="amt" min="0" value="1" inputmode="numeric">`,
      [{ label: t('Sheet.Cancel'), value: null }, { label: t('Sheet.Heal'), value: 'heal' }, { label: t('Sheet.Hurt'), value: 'hit' }])
    const n = Math.max(0, Math.floor(Number(r.data.amt) || 0))
    if (!r.value || !n) return
    const m = hpMax()
    const v = r.value === 'hit' ? (m != null ? Math.min(m, hpCur() + n) : hpCur() + n) : Math.max(0, hpCur() - n)
    hero.set('data.hp.current', v).catch(fail)
  })
  // texte d'une affliction : champ descr de la règle de la bibliothèque (mis en cache), Markdown allégé
  const afflCache = new Map()
  const mdLite = (md) => esc(md).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/^#+\s*/gm, '').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
  async function afflInfo(a) {
    if (afflCache.has(a.name)) return afflCache.get(a.name)
    let info = { text: '', reference: a.reference || '' }
    try {
      // EP.query ne renvoie pas `descr` : le texte rendu vient de la transformation des règles (views/transforms/rule.json : view.data.text)
      const r = await EP.query({ entity: 'Rule', search: a.name, limit: 30, keys: ['view.data.text', 'view.data.raw'] })
      const list = r.entries || []
      const e = list.find((x) => a.reference && slugOf(x.reference) === slugOf(a.reference)) || list.find((x) => String(x.name).toLowerCase() === a.name.toLowerCase()) || null
      if (e) { const vd = (e.view && e.view.data) || {}; info = { text: String(vd.text || '') || (vd.raw ? mdFull(String(vd.raw)) : ''), reference: e.reference || info.reference } }
    } catch (err) { /* hors bibliothèque : pas de texte */ }
    afflCache.set(a.name, info)
    return info
  }
  $('badges').addEventListener('click', async (ev) => {
    const ins = ev.target.closest('button[data-ins]')
    if (ins) {
      const k = Number(ins.dataset.ins), cur = Number(hero.get('view.data.insanityValue') ?? 0)
      hero.set('data.insanity.current', k < cur ? k : k + 1).catch(fail)
      return
    }
    const cb = ev.target.closest('button[data-c]')
    if (cb) {
      const k = cb.dataset.c, cur = Number(hero.get('view.data.' + (k === 'insanity' ? 'insanityValue' : 'corruptionValue')) ?? 0)
      hero.set(`data.${k}.current`, Math.max(0, cur + Number(cb.dataset.d))).catch(fail)
      return
    }
    const b = ev.target.closest('button[data-b]'); if (!b) return
    if (b.dataset.b === 'mind') { mindDialog(); return }
    if (b.dataset.b === 'luck') { hero.set('data.luck', !hero.get('data.luck')).catch(fail); return }
    if (b.dataset.b === 'aff-add') { afflictionDialog(); return }
    const list = affList()
    if (b.dataset.b === 'aff-more') {
      const infos = await Promise.all(list.map(afflInfo))
      const dm = []
      const body = dm.map(([k, v]) => `<div class="afftxt"><b>${esc(k)}.</b> ${esc(v)}</div>`).join('') + (list.length ? list.map((a, i) => `<details class="ad"><summary>${esc(a.name)}</summary><div class="afftxt">${infos[i].text ? infos[i].text : `<span class="empty">${esc(t('Sheet.NoDescr'))}</span>`}</div></details>`).join('') : `<p class="empty">${esc(t('Sheet.NoAfflictions'))}</p>`)
      const r = await dialog(t('Sheet.AfflictionsNow'), body, [{ label: t('Sheet.Close'), value: null }, { label: t('Sheet.EditList'), value: 'edit', primary: true }])
      if (r.value === 'edit') afflictionDialog()
      return
    }
    if (b.dataset.b === 'aff') {
      const a = list[Number(b.dataset.i)]; if (!a) return
      const info = await afflInfo(a)
      const r = await dialog(a.name, `<div class="afftxt">${info.text ? info.text : `<span class="empty">${esc(t('Sheet.NoDescr'))}</span>`}</div>`,
        [{ label: t('Sheet.Close'), value: null }, ...(info.reference ? [{ label: t('Sheet.SeeRule'), value: 'see' }] : []), { label: t('Sheet.Remove'), value: 'del', primary: true }])
      if (r.value === 'see') openRef(info.reference, a.name)
      if (r.value === 'del') removeAff(a).catch(fail)
    }
  })
  // afflictions = règles de type Affliction de la bibliothèque (le système n'en contient aucune, et le joueur n'en crée pas : c'est au MJ de créer la règle).
  // État d'une affliction : drapeau data.conditions.<slug de la règle>, relié au suivi de combat par les liens que génère outils/generer-liens-afflictions.py
  let afflLib = [], afflLoaded = false
  // adresse d'une règle : /<type>/<slug>[/<source>] (ex. /Affliction/effraye/osd) : le slug est le 2ᵉ segment, pas le dernier
  const slugOf = (ref) => { const p = String(ref || '').split('/').filter(Boolean); return p.length > 1 ? p[1] : (p[0] || '') }
  const humanize = (k) => String(k).replace(/-/g, ' ').replace(/^./, (ch) => ch.toUpperCase())
  async function loadAfflictions() {
    try { afflLib = ((await EP.query({ entity: 'Rule', where: { type: 'Affliction' }, sort: 'name', limit: 300 })).entries || []).map((e) => ({ name: e.name, reference: e.reference, slug: slugOf(e.reference) })) } catch (e) { afflLib = [] }
    afflLoaded = true
  }
  const condKeys = () => { const c = hero.get('data.conditions') || {}; return Object.keys(c).filter((k) => c[k] === true) }
  const affList = () => condKeys().map((k) => { const e = afflLib.find((x) => x.slug === k); return { name: e ? e.name : humanize(k), reference: e ? e.reference : '', flag: k } }).sort((x, y) => x.name.localeCompare(y.name))
  const removeAff = async (a) => { await hero.set('data.conditions.' + a.flag, false) }
  async function afflictionDialog() {
    if (!afflLoaded) await loadAfflictions()
    const opts = afflLib.map((e) => ({ key: e.slug, name: e.name }))
      .concat(condKeys().filter((k) => !afflLib.some((e) => e.slug === k)).map((k) => ({ key: k, name: humanize(k) })))
    const has = (o) => hero.get('data.conditions.' + o.key) === true
    const body = opts.length ? opts.map((o, i) => `<label class="opt"><input type="checkbox" id="a${i}"${has(o) ? ' checked' : ''}> ${esc(o.name)}</label>`).join('')
      : `<p class="empty">${esc(t('Sheet.NoAfflictionRules'))}</p>`
    const r = await dialog(t('Card.Afflictions'), body, [{ label: t('Sheet.Cancel'), value: null }, { label: t('Sheet.Step.Validate'), value: 'ok', primary: true }])
    if (r.value !== 'ok') return
    for (const [i, o] of opts.entries()) {
      const want = !!r.data['a' + i]; if (want === has(o)) continue
      try { await hero.set('data.conditions.' + o.key, want) } catch (e) { note(t('Sheet.AfflictionNotLinked')) }
    }
  }

  // ===== ACTIONS =====
  const handsText = { One: t('Character.HandsOne'), Two: t('Character.HandsTwo'), Off: t('Character.HandsOff') }
  let weapons = []
  function renderWeapons(d) {
    weapons = (d.weapons || []).filter((w) => w.weaponType !== 'Shield' && w.weaponType !== 'Ammunition')
    if (!diff('weapons', [weapons, last.status])) return
    $('attacks').innerHTML = weapons.length ? weapons.map((w, i) => {
      const bonus = Number(w.attackBonus ?? 0)
      const m = /^data\.items\.(\d+)$/.exec(w.ammoPath || '')
      const ammo = m ? `<div class="am"><span class="al">${esc(w.ammoName || t('Sheet.Ammo'))}</span>${usesHTML(w.ammoUses, w.ammoSpent, `data.items[${m[1]}].usesSpent`, w.ammoName)}<span class="auto">${esc(t('Sheet.AmmoAuto'))}</span></div>` : ''
      return `<div class="wp"><div class="wl">${ic(iconOf(w), 30)}<span class="nm"><span class="lk" data-open="${i}">${esc(w.name)}</span><small>${esc(handsText[w.weaponHands] || '')}</small></span>
        <button type="button" class="roll" data-rs="w:${i}" title="Toucher : attaque · clic droit ou appui long : avantage, désavantage"${off()}>${signed(bonus)}</button>
        ${w.weaponDamage ? `<button type="button" class="roll dmg" data-act="damage" data-i="${i}" title="${esc(t('Characteristics.Damage'))}"${off()}>${esc(w.weaponDamage)}</button>` : ''}</div>${ammo}</div>`
    }).join('') : `<p class="empty">${esc(t('Sheet.NoWeapon'))}</p>`
  }
  $('attacks').addEventListener('click', (ev) => {
    const o = ev.target.closest('[data-open]')
    if (o) {
      const w = weapons[Number(o.dataset.open)]; if (!w) return
      const list = hero.get('data.items') || [], m = /^data\.items\.(\d+)$/.exec(w.path || '')
      let ix = m ? Number(m[1]) : list.findIndex((x) => x.name === w.name && x.itemType === 'Weapon' && x.equipped)
      if (ix >= 0 && list[ix]) editItem(ix); else openRef(w.reference, w.name)
      return
    }
    const b = ev.target.closest('button[data-act=damage]'); if (!b) return
    const w = weapons[Number(b.dataset.i)]; if (w) EP.roll(dmgFormula(w.weaponDamage), { label: w.name, type: 'damage' }).catch(fail)
  })

  // actions : liens vers des règles de type Action de la bibliothèque (data.actions). Le bloc affiche la DESCRIPTION de la règle (rendue par l'app) ; les liens de jet écrits dans le Markdown
  // de la règle deviennent des boutons : [Test](/roll/d20+AGI/Se%20cacher/check) — STR, AGI, INT, WIL, PER sont remplacés par le modificateur du personnage (avantage au clic droit ou appui long)
  const linkSpecs = []
  const TERM = /[+-](?:\d+|STR|AGI|INT|WIL|PER)/gi
  function rollSpec(f, label, type) {
    const m = String(f).replace(/\[[^\]]*\]/g, '').match(/^d20((?:[+-](?:\d+|STR|AGI|INT|WIL|PER))*)$/i)   // les dés nommés des liens (d20[Test]+AGI) ne gênent pas la lecture
    if (!m) return { raw: dmgFormula(String(f)), label, type: type || 'damage' }
    return { terms: (m[1].match(TERM) || []).map((x) => ({ sign: x[0] === '-' ? -1 : 1, v: x.slice(1).toUpperCase() })), label, kind: type === 'attack' ? 'attack' : 'check' }
  }
  function termsSpec(sp) {
    let mod = 0, attr = null
    for (const x of sp.terms) { if (/^\d+$/.test(x.v)) mod += x.sign * Number(x.v); else { const a = ATTR.find((y) => y[0] === x.v); mod += x.sign * Number(hero.get('view.data.' + a[2]) || 0); attr = attr || x.v } }
    const a = attr && ATTR.find((y) => y[0] === attr)
    return { attr, label: sp.label, die: a ? attrName(a) : t('Sheet.Die.Test'), mod, kind: sp.kind }
  }
  // rendu Markdown minimal (repli si l'app ne fournit pas le texte déjà rendu)
  const DICE = /(^|[\s(])(\d*d\d+(?:[+-]\d+)?)(?![\w\]\d])/gi
  const mdFull = (md, label) => esc(md).split(/\n{2,}/).map((p) => '<p>' + p.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>').replace(/\[([^\]]+)\]\(&lt;([^)]*?)&gt;\)|\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t1, u1, t2, u2) => `<a href="${u1 || u2}">${t1 || t2}</a>`)
    .replace(/(<a [^>]*>.*?<\/a>)|([^<]+)/g, (m, link, txt) => link || txt.replace(DICE, (_, pre, f) => `${pre}<a href="/roll/${encodeURIComponent(f)}/${encodeURIComponent(label || '')}/damage">${f}</a>`)).replace(/\n/g, '<br>') + '</p>').join('')
  // sorts et talents : le texte est affiché tel quel (retours à la ligne conservés) ; seuls les liens de jet [texte](/roll/…) et les formules de dés (3d6, 1d6+1) deviennent des boutons
  const rollText = (txt, label) => {
    // texte d'une entité copié dans la fiche : Markdown allégé (liens, gras, italique, tableaux) ; jets [texte](/roll/…) et dés nus = boutons
    // liens vers une entité : /rule/slug etc. (pastille colorée par type, cliquable) ; lien court `(rule)` : adresse déduite du nom
    const keep = []
    let s = esc(txt).replace(/\[([^\]]+)\]\((?:&lt;([\s\S]*?)&gt;|([^)\s]*))\)/g, (_, t1, u1, u2) => {
      let u = String(u1 || u2 || '').trim()
      if (/^(rule|spell|item|creature|npc|vehicle|ancestry|path|transformation|complication|table)$/.test(u)) u = '/' + u + '/' + t1.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[’']/g, '-').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '')   // lien court [nom](type) : adresse déduite du nom (E+ ignore casse et accents)
      return '\u0001' + (keep.push(/^\//.test(u) ? `<a href="${u.replace(/"/g, '&quot;')}">${t1}</a>` : t1) - 1) + '\u0001'
    }).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>')
    const lines = s.split('\n'), out = []
    for (let k = 0; k < lines.length; k++) {
      if (!/^\s*\|.*\|\s*$/.test(lines[k])) { out.push(lines[k]); continue }
      const rows = []
      while (k < lines.length && /^\s*\|.*\|\s*$/.test(lines[k])) { rows.push(lines[k].trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim())); k++ }
      k--
      const body = rows.filter((r) => !r.every((c) => /^:?-{2,}:?$/.test(c)))
      out.push('<table class="mdt">' + body.map((r, ri) => '<tr>' + r.map((c) => `<${ri === 0 ? 'th' : 'td'}>${c}</${ri === 0 ? 'th' : 'td'}>`).join('') + '</tr>').join('') + '</table>')
    }
    return out.join('\n').replace(/\u0001(\d+)\u0001/g, (_, i) => keep[Number(i)])
      .replace(/(<a [^>]*>.*?<\/a>)|(<[^>]+>)|([^<]+)/g, (m, link, tag, plain) => link || tag || plain.replace(DICE, (_, pre, f) => `${pre}<a href="/roll/${encodeURIComponent(f)}/${encodeURIComponent(label || '')}/damage">${f}</a>`))
  }
  const actHtml = new Map()
  async function ruleDescrHtml(a) {
    if (actHtml.has(a.reference)) return actHtml.get(a.reference)
    let html = ''
    // 1) texte rendu par l'app, fourni par la transformation des règles (views/transforms/rule.json : data.text = descr|md), lu par EP.query
    try {
      const r = await EP.query({ entity: 'Rule', search: a.name, limit: 30, keys: ['view.data.text', 'view.data.raw'] })
      const e = (r.entries || []).find((x) => slugOf(x.reference) === slugOf(a.reference)) || (r.entries || []).find((x) => x.name === a.name)
      const vd = (e && e.view && e.view.data) || {}
      html = String(vd.text || '') || (vd.raw ? mdFull(String(vd.raw)) : '')
    } catch (e) { /* repli ci-dessous */ }
    // 2) repli : la page rendue de la règle
    if (!html) { try { const r = await fetch(a.reference); if (r.ok) { const el = new DOMParser().parseFromString(await r.text(), 'text/html').querySelector('.description'); if (el) html = el.innerHTML } } catch (e) { /* aucun texte */ } }
    if (html) actHtml.set(a.reference, html)
    return html
  }
  function wireRolls(el) {
    el.querySelectorAll('a[href]').forEach((a) => {
      const h = a.getAttribute('href') || ''
      if (/^\/roll\//i.test(h)) {
        const [f, label, type] = h.slice(6).split('/').map((x) => { try { return decodeURIComponent(x) } catch (e) { return x } })
        const sp = rollSpec(f, label || a.textContent, type); const b = document.createElement('button'); b.type = 'button'; b.className = 'roll sm inl' + (sp.raw ? ' dmg' : '') + (a.textContent.trim().length > 9 ? ' txt' : ''); b.dataset.rs = 'l:' + (linkSpecs.push(sp) - 1); b.textContent = a.textContent; a.replaceWith(b)
      } else { a.dataset.go = h; const mk = h.match(/^\/([a-z]+)\//); if (mk) a.dataset.k = mk[1]; a.removeAttribute('href'); a.classList.add('lk') }
    })
  }
  async function fillAct(box) {
    const a = (hero.get('data.actions') || [])[Number(box.dataset.act)]
    if (!a || box.dataset.ok) return
    const html = await ruleDescrHtml(a)
    box.innerHTML = html || `<span class="empty">${esc(t('Sheet.NoDescr'))}</span>`
    wireRolls(box); box.dataset.ok = '1'
  }
  // accordéon (style « pastille » : rond + / − comme les rangs de sorts) : replié par défaut ; le texte de l'action et ses boutons de jet apparaissent à l'ouverture
  function renderActions() {
    const list = hero.get('data.actions') || []
    if (!diff('actions', [last.status, ui.edit, list.map((a) => a.reference + a.name)])) return
    $('actions').innerHTML = list.length ? list.map((a, i) => bandRow({ k: 'act:' + a.reference, name: a.name,
      body: `<div class="tx adesc" data-act="${i}"></div><div class="acl"><span class="lk" data-go="${esc(a.reference || '')}">${esc(t('Sheet.SeeRule'))}</span></div>`,
      del: ui.edit ? `<button type="button" class="del" data-delact="${i}" title="${esc(t('Sheet.Remove'))}"${off()}>✕</button>` : '' })).join('')
      : `<p class="empty">${esc(t('Sheet.NoActions'))}</p>`
    $('actions').querySelectorAll('details[open] .adesc').forEach(fillAct)
    $('add-action').hidden = false
    $('add-action').disabled = !online()
  }
  document.addEventListener('toggle', (ev) => { const d = ev.target; if (d.matches && d.matches('details.bd') && d.open) { const b = d.querySelector('.adesc'); if (b) fillAct(b) } }, true)
  document.addEventListener('click', (ev) => { const g = ev.target.closest('#spells [data-go], #talents [data-go], #complication [data-go]'); if (g && g.dataset.go) { ev.preventDefault(); epOpen(g.dataset.go) } })
  $('actions').addEventListener('click', async (ev) => {
    const g = ev.target.closest('[data-go]'); if (g && g.dataset.go) { ev.preventDefault(); epOpen(g.dataset.go); return }
    const del = ev.target.closest('[data-delact]')
    if (del) {
      const a = (hero.get('data.actions') || [])[Number(del.dataset.delact)]
      if (a && await ask(tf('Sheet.RemoveNamed', { name: a.name }), { action: t('Sheet.Remove'), title: t('Sheet.Remove') })) hero.remove(`data.actions[${del.dataset.delact}]`).catch(fail)
    }
  })
  $('add-action').addEventListener('click', async () => {
    try {
      const have = new Set((hero.get('data.actions') || []).map((a) => a.reference))
      const picked = await pickEntries('Rule', t('Sheet.AddAction'), { where: { type: 'Action' }, filter: (e) => !have.has(e.reference) })
      for (const e of picked) await hero.insert('data.actions', { name: e.name, reference: e.reference })
    } catch (e) { fail(e) }
  })
  // lien « Repos » : la règle est cherchée par son slug (identique dans toutes les langues), pas par son nom
  async function openRuleSlug(slug) {
    try {
      const r = await EP.query({ entity: 'Rule', search: slug, limit: 20 })
      const e = (r.entries || []).find((x) => slugOf(x.reference) === slug)
      if (e) epOpen(e.reference)
    } catch (err) { fail(err) }
  }
  $('rest-link').addEventListener('click', () => openRuleSlug('repos'))

  // repos (livre de base) : ~8 h, une fois par 24 h, soigne la vitesse de guérison ; 24 h : le double.
  // Les utilisations des talents se récupèrent après un repos ; celles des sorts après repos + au moins 1 min de méditation.
  async function rest(mult) {
    const heal = Number(hero.get('view.data.healingValue') ?? 0) * mult
    const withSpells = $('rest-spells').classList.contains('on')
    const cur = Number(hero.get('data.hp.current') ?? 0)
    const msg = tf('Sheet.RestAsk', { r: mult === 1 ? t('Sheet.Rest8') : t('Sheet.Rest24'), n: Math.min(heal, cur), s: withSpells ? t('Sheet.RestSpells') : '' })
    if (!(await ask(msg, { title: mult === 1 ? t('Sheet.Rest8') : t('Sheet.Rest24'), action: t('Sheet.DoRest') }))) return
    try {
      await hero.update((data) => {
        data.hp = data.hp || {}
        data.hp.current = Math.max(0, Number(data.hp.current ?? 0) - heal)
        const clear = (x) => { if (x && x.usesSpent) x.usesSpent = 0 }
        for (const o of ORIGINS) {
          const root = data[o.root]; if (!root) continue
          for (const e of o.entries) for (const k of [e.t, e.c]) if (k) (at(root, k) || []).forEach(clear)
        }
        if (withSpells) (data.spells || []).forEach(clear)
      })
    } catch (e) { fail(e) }
  }
  // tour : choix du joueur (data.turn = none | fast | slow), repris par la carte du MJ et le suivi de combat ; un clic passe au choix suivant (non choisi → rapide → lent → non choisi), comme sur la carte
  $('turn').addEventListener('click', () => {
    const cur = String(hero.get('data.turn') || 'none')
    hero.set('data.turn', cur === 'none' ? 'fast' : cur === 'fast' ? 'slow' : 'none').catch(fail)
  })
  $('rest-8').addEventListener('click', () => rest(1))
  $('rest-24').addEventListener('click', () => rest(2))
  $('rest-spells').addEventListener('click', () => {
    const on = !$('rest-spells').classList.contains('on')
    $('rest-spells').classList.toggle('on', on); $('rest-spells').setAttribute('aria-checked', String(on))
  })

  // ===== MAGIE =====
  const TRADITIONS = ["Air", "Alchemy", "Alteration", "Arcana", "Battle", "Blighter", "Blood", "Celestial", "Chaos", "Conjuration", "Curse", "Death", "Demonology", "Destruction", "Diabolist", "Divination", "Earth", "Enchantment", "Exorcist", "Fey", "Fire", "Forbidden", "Illusion", "Invocation", "Life", "Madness", "Magician", "Metal", "Nature", "Necromancer", "Necromancy", "Order", "Priest", "Primal", "Protection", "Rune", "Shadow", "Shaman", "Song", "Soul", "Spellbinder", "Spiritualism", "Storm", "Technomancer", "Technomancy", "Telekinesis", "Telepathy", "Teleportation", "Templar", "Tenebrist", "Theurgy", "Time", "Transformation", "Warden", "Water", "Witch"]
  const spellKeys = ['descr', 'spellType', 'spellRank', 'spellRequirement', 'spellTarget', 'spellArea', 'spellDuration', 'spellTradition', 'spellEffects']
  const openSet = new Set()
  document.addEventListener('toggle', (ev) => { const k = ev.target.dataset && ev.target.dataset.k; if (k) ev.target.open ? openSet.add(k) : openSet.delete(k) }, true)
  // lancers par jour : rang et Puissance (livre de base) ; même table que views/transforms/character.json
  const SPELL_TABLE = { 1: [[5, 3], [2, 2], [1, 1]], 2: [[8, 3], [4, 2], [2, 1]], 3: [[9, 3], [5, 2], [3, 1]], 4: [[10, 3], [6, 2], [4, 1]], 5: [[8, 2], [5, 1]] }
  function spellMax(x, power) {
    if (x.usesMaximumOverride != null && x.usesMaximumOverride !== '') return Number(x.usesMaximumOverride)
    const rk = Number(x.spellRank ?? 0), p = Number(power ?? 0)
    if (rk === 0) return p + 1
    if (SPELL_TABLE[rk]) { const row = SPELL_TABLE[rk].find(([min]) => p >= min); return row ? row[1] : 0 }
    return rk >= 6 && rk <= 10 && p >= (rk === 6 ? 6 : rk) ? 1 : 0
  }
  const tradOf = (x) => x.spellTradition && x.spellTradition.tradition
  function renderMagic(d) {
    const trads = hero.get('data.traditions') || []
    const spells = d.spells || []
    if (!diff('magic', [ui.edit, ui.trad, last.status, trads, spells.map((x) => [x.name, x.spellRank, x.usesSpent, x.usesMaximum, x.usesMaximumOverride, tradOf(x)]), d.powerValue])) return
    if (ui.trad !== 'all' && !trads.includes(ui.trad)) ui.trad = 'all'
    $('traditions').innerHTML = `<button type="button" class="chip${ui.trad === 'all' ? ' on' : ''}" data-trad="all">${esc(t('Sheet.AllTrad'))}</button>` +
      trads.map((k, i) => `<button type="button" class="chip${ui.trad === k ? ' on' : ''}" data-trad="${k}">${esc(EP.label('SpellTradition', k))}${ui.edit ? `<span class="x" data-deltrad="${i}">✕</span>` : ''}</button>`).join('') +
      `<button type="button" class="add" id="add-trad"${off()}>+ Tradition</button>`
    const rows = spells.map((x, i) => ({ x, i })).filter(({ x }) => ui.trad === 'all' || tradOf(x) === ui.trad)
      .sort((a, b) => Number(a.x.spellRank ?? 0) - Number(b.x.spellRank ?? 0) || String(a.x.name).localeCompare(String(b.x.name), 'fr'))
    const byRank = new Map()
    rows.forEach((r) => { const rk = Number(r.x.spellRank ?? 0); if (!byRank.has(rk)) byRank.set(rk, []); byRank.get(rk).push(r) })
    const spellUses = (x, i) => {
      const mx = spellMax(x, d.powerValue)
      return mx > 0 ? usesHTML(mx, x.usesSpent, `data.spells[${i}].usesSpent`, x.name) : ''
    }
    const row = ({ x, i }) => {
      const rk = Number(x.spellRank ?? 0)
      const meta = [tradOf(x) && EP.label('SpellTradition', tradOf(x)), x.spellType && EP.label('SpellType', x.spellType),
        x.spellTradition && x.spellTradition.darkMagic ? t('Spell.DarkMagic') : '', x.spellTradition && x.spellTradition.psychicTradition ? t('Spell.PsychicTradition') : '',
        x.spellTradition && x.spellTradition.onlyIncantation ? t('Spell.OnlyIncantation') : ''].filter(Boolean).join(' · ')
      const line = (lk, v) => v ? `<p class="ttext"><b>${esc(t(lk))}.</b> ${esc(v)}</p>` : ''
      const k = 'sp/' + x.name + '/' + i
      return bandRow({ k, name: x.name, meta, uses: spellUses(x, i),
        body: `${line('Spell.Requirement', x.spellRequirement)}${line('Spell.Target', x.spellTarget)}${line('Spell.Area', x.spellArea)}${line('Spell.Duration', x.spellDuration)}<div class="ttext">${rollText(x.descr || '', x.name)}</div>${(x.spellEffects || []).map((e) => `<div class="ttext">${e.name ? '<b>' + esc(e.name) + '.</b> ' : ''}${rollText(e.text || '', x.name)}</div>`).join('')}`,
        del: ui.edit ? `<button type="button" class="del" data-delspell="${i}" title="${esc(t('Sheet.Remove'))}"${off()}>✕</button>` : '' })
    }
    $('spells').innerHTML = byRank.size ? [...byRank].sort((a, b) => a[0] - b[0]).map(([rk, list]) => `<div>${box(t('Spell.Rank') + ' ' + rk, list.map(row).join(''))}</div>`).join('') : `<p class="empty">${esc(t('Sheet.NoSpells'))}</p>`
    wireRolls($('spells'))
    $('add-spell').disabled = !online()
    document.querySelector('[data-panel=magic] [data-edit]').textContent = editLabel()
  }
  $('traditions').addEventListener('click', async (ev) => {
    const del = ev.target.closest('[data-deltrad]')
    if (del) { ev.stopPropagation(); hero.set('data.traditions', (hero.get('data.traditions') || []).filter((_, j) => j !== Number(del.dataset.deltrad))).catch(fail); return }
    const b = ev.target.closest('button[data-trad]')
    if (b) { ui.trad = b.dataset.trad; rerender(); return }
    if (ev.target.closest('#add-trad')) {
      const k = await pickTradition(t('Sheet.Trad.Add'))
      if (k) hero.set('data.traditions', (hero.get('data.traditions') || []).concat(k)).catch(fail)
    }
  })
  // sorts limités aux traditions autorisées par le niveau (`levelTraditionOnly`) : filtre + clé de tradition lue dans la bibliothèque
  const onlyOpts = (only) => (only && only.length ? { filter: (e) => { const x = (e.data && e.data.spellTradition) || e['data.spellTradition'] || e.spellTradition; return !!x && only.includes(x.tradition) }, keys: ['data.spellTradition'] } : {})
  // choix d'une tradition parmi celles que le personnage ne connaît pas encore ; rend la clé ou null
  async function pickTradition(title, only) {
    const cur = hero.get('data.traditions') || []
    const opts = TRADITIONS.filter((k) => !cur.includes(k) && (!only || !only.length || only.includes(k))).map((k) => ({ k, l: EP.label('SpellTradition', k) })).sort((a, b) => a.l.localeCompare(b.l, 'fr'))
    const r = await dialog(title, `<input type="text" id="tsearch" placeholder="${esc(t('Sheet.Search'))}" autocomplete="off"><div class="picklist" id="tlist">${opts.map((o) => `<label class="opt" data-l="${esc(o.l.toLowerCase())}"><input type="radio" name="trad" id="trad" value="${o.k}"> ${esc(o.l)}</label>`).join('')}</div>`,
      [{ label: t('Sheet.Cancel'), value: null }, { label: t('Sheet.Add'), value: 'ok', primary: true }],
      (ov) => ov.querySelector('#tsearch').addEventListener('input', (e) => { const q = e.target.value.trim().toLowerCase(); ov.querySelectorAll('#tlist label').forEach((l) => { l.hidden = q && !l.dataset.l.includes(q) }) }))
    return r.value === 'ok' && r.data.trad ? r.data.trad : null
  }
  $('add-spell').addEventListener('click', async () => {
    try { const picked = await pickEntries('Spell', t('Sheet.AddSpell'), { knownTraditions: true }); for (const e of picked) await hero.embed('data.spells', e, spellKeys) } catch (e) { fail(e) }
  })
  $('spells').addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-delspell]'); if (!b) return
    const i = Number(b.dataset.delspell), x = (hero.get('data.spells') || [])[i]
    if (!(await ask(tf('Sheet.RemoveNamed', { name: (x && x.name) || '' }), { action: t('Sheet.Remove'), title: t('Sheet.Remove') }))) return
    hero.remove(`data.spells[${i}]`).catch(fail)
  })

  // ===== TALENTS : un encadré par origine (nom de la voie dans le bandeau), talents triés par niveau =====
  // entrées par origine : (racine, niveau, clé des talents, clé des choix) ; lecture dans `view.data`, écriture dans le modèle
  const lvlSources = (root, tpl, levels) => levels.map((n) => ({ root, level: n, t: tpl.t(n), c: tpl.c(n) }))
  const pathTpl = { t: (n) => `level${n}Talent`, c: (n) => `level${n}Choice` }
  const ORIGINS = [
    { root: 'ancestry', label: t('Character.Ancestry'), entries: [{ root: 'ancestry', level: 0, t: 'talent' }].concat(lvlSources('ancestry', { t: (n) => `ancestryLevel${n}.talent`, c: (n) => `ancestryLevel${n}.choice` }, [1, 2, 4, 5, 8])) },
    { root: 'transformation', label: t('Character.Transformation'), entries: [{ root: 'transformation', level: 0, t: 'talent' }].concat(lvlSources('transformation', { t: (n) => `transfLevel${n}.talent`, c: (n) => `transfLevel${n}.choice` }, [1, 2, 4, 5, 8])) },
    { root: 'novicePath', label: t('Path.Novice'), entries: lvlSources('novicePath', pathTpl, [1, 2, 5, 8]) },
    { root: 'expertPath', label: t('Path.Expert'), entries: lvlSources('expertPath', pathTpl, [3, 6, 9]) },
    { root: 'masterPath', label: t('Path.Master'), entries: lvlSources('masterPath', pathTpl, [7, 10]) },
    { root: 'secondPath', label: t('Character.SecondPath'), entries: lvlSources('secondPath', pathTpl, [7, 10]) },
  ]
  let talentRows = []
  // pour chaque origine existante : { o, root, levels: Map(niveau → { talents, choices }) }
  let usesMods = []
  const normName = (s) => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim()
  const usesExtra = (x) => { const k = normName(x.name); return usesMods.reduce((acc, [n, b]) => acc + (n === k ? b : 0), 0) }
  function collect(d) {
    const lvl = Number(d.level ?? 0)
    talentRows = []
    const groups = []
    for (const o of ORIGINS) {
      const root = d[o.root]
      if (!root || !root.name) continue
      const g = { o, root, levels: new Map() }
      const slot = (n) => { if (!g.levels.has(n)) g.levels.set(n, { talents: [], choices: [] }); return g.levels.get(n) }
      for (const e of o.entries) {
        if (e.level > lvl) continue
        slot(e.level)
        ;(at(root, e.t) || []).forEach((x, i) => { talentRows.push({ path: `data.${e.root}.${e.t}[${i}]` }); slot(e.level).talents.push({ x, row: talentRows.length - 1 }) })
        if (e.c) (at(root, e.c) || []).forEach((x, i) => {
          talentRows.push({ path: `data.${e.root}.${e.c}[${i}]` })
          const row = talentRows.length - 1
          if (x.chosen) slot(e.level).talents.push({ x, row, chosen: true })
          slot(e.level).choices.push({ x, row })
        })
      }
      groups.push(g)
    }
    // talents qui modifient les utilisations d'un autre talent (usesTarget = nom du talent visé, usesBonus = utilisations en plus)
    usesMods = []
    for (const g of groups) for (const v of g.levels.values()) for (const a of v.talents) if (a.x.usesTarget && Number(a.x.usesBonus)) usesMods.push([normName(a.x.usesTarget), Number(a.x.usesBonus)])
    return groups
  }
  const talentRow = (n, a) => {
    const x = a.x
    const max = (x.usesBase != null ? Number(x.usesMaximum ?? x.usesBase) : 0) + usesExtra(x)
    const uses = max > 0 && a.row >= 0 ? usesHTML(max, x.usesSpent, talentRows[a.row].path + '.usesSpent', x.name) : ''
    return bandRow({ k: 'tl/' + (a.row >= 0 ? talentRows[a.row].path : n + x.name), name: x.name, level: n, uses, body: `<div class="tx">${rollText(x.text || '', x.name)}</div>` })
  }
  function renderTalents(d) {
    const groups = collect(d)
    const other = hero.get('data.otherTalents') || []
    if (!diff('talents', [ui.edit, last.status, d.level, groups.map((g) => [g.root.name, [...g.levels].map(([n, v]) => [n, v.talents.map((a) => [a.x.name, a.x.usesSpent, a.x.usesMaximum, usesExtra(a.x)]), v.choices.map((a) => !!a.x.chosen)])]), other.map((a) => [a.name, a.text])])) return
    const blocks = []
    for (const g of groups) {
      const rows = []
      for (const [n, v] of g.levels) for (const a of v.talents) rows.push({ n, a })
      rows.sort((p, q) => q.n - p.n)
      const w = rows.reduce((acc, { a }) => acc + 70 + String(a.x.text || '').length / 2, 90)
      blocks.push({ w, html: box(g.o.label, `<div class="sb">${esc(g.root.name)}</div>` + (rows.length ? rows.map(({ n, a }) => talentRow(n, a)).join('') : `<p class="empty">${esc(t('Sheet.NoTalentsLevel'))}</p>`), 'tl') })
    }
    blocks.push({ w: 90 + other.reduce((acc, x) => acc + 70 + String(x.text || '').length / 2, 0), html: box(t('Character.OtherTalents'), other.length ? other.map((x, i) => bandRow({ k: 'ot/' + i + x.name, name: x.name, body: `<div class="tx">${rollText(x.text || '', x.name)}</div>`, del: ui.edit ? `<button type="button" class="del" data-deltalent="${i}" title="${esc(t('Sheet.Remove'))}"${off()}>✕</button>` : '' })).join('') : `<p class="empty">${esc(t('Sheet.NoOtherTalents'))}</p>`, 'tl') })
    // répartition en deux colonnes : chaque encadré va dans la colonne la moins haute
    const colA = [], colB = []; let hA = 0, hB = 0
    for (const bl of blocks) { if (hA <= hB) { colA.push(bl.html); hA += bl.w } else { colB.push(bl.html); hB += bl.w } }
    const html = `<div class="cols2"><div>${colA.join('')}</div><div>${colB.join('')}</div></div>`
    $('talents').innerHTML = html
    wireRolls($('talents'))
    $('add-talent').disabled = !online()
    document.querySelector('[data-panel=talents] [data-edit]').textContent = editLabel()
  }
  $('talents').addEventListener('click', async (ev) => {
    const b = ev.target.closest('[data-deltalent]'); if (!b) return
    const i = Number(b.dataset.deltalent), x = (hero.get('data.otherTalents') || [])[i]
    if (!(await ask(tf('Sheet.RemoveNamed', { name: (x && x.name) || '' }), { action: t('Sheet.Remove'), title: t('Sheet.Remove') }))) return
    hero.remove(`data.otherTalents[${i}]`).catch(fail)
  })
  $('add-talent').addEventListener('click', async () => {
    const r = await dialog(t('Sheet.NewTalent'), '<input type="text" id="n" placeholder="' + esc(t('Common.Name')) + '"><textarea id="x" rows="4" placeholder="' + esc(t('Common.Description')) + '"></textarea>', [{ label: t('Sheet.Cancel'), value: null }, { label: t('Sheet.Add'), value: 'ok', primary: true }])
    if (r.value === 'ok' && String(r.data.n).trim()) hero.insert('data.otherTalents', { name: String(r.data.n).trim(), text: String(r.data.x || '') }).catch(fail)
  })

  // ===== SAC =====
  const coins = [['shards', 'Character.Shards', 'c1'], ['sc', 'Character.CoinSC', 'c2'], ['ca', 'Character.CoinCA', 'c3'], ['co', 'Character.CoinCO', 'c4']]
  $('coins').innerHTML = coins.map(([k, , c]) => `<div class="coin ${c}"><span class="disc"><input id="coin-${k}" type="number" min="0" aria-labelledby="lbl-${k}"></span><span class="cn" id="lbl-${k}"></span></div>`).join('')
  coins.forEach(([k, lk]) => { $('lbl-' + k).textContent = t(lk); EP.field($('coin-' + k), { store: hero, path: 'data.currency.' + k }) })
  const itemKeys = ['descr', 'quantity', 'itemType', 'gearType', 'marvelType', 'price', 'availability', 'armorType', 'armorRequirement', 'armorDefenseFixed', 'weaponType', 'weaponRequirement', 'weaponDamage', 'weaponHands', 'weaponDefensive', 'defensiveValue', 'weaponReach', 'reachValue', 'weaponProperty', 'ammunitionRequirement', 'ammunitionType', 'uses', 'armorDefenseAgility', 'relic']
  // seuls les armes, armures et boucliers s'équipent ; les munitions non
  const equippable = (it) => it.itemType === 'Armor' || (it.itemType === 'Weapon' && it.weaponType !== 'Ammunition')
  const subText = (it) => [it.itemType && EP.label('ItemType', it.itemType), it.weaponDamage, it.armorDefenseFixed != null ? t('Sheet.DefShort') + ' ' + it.armorDefenseFixed : '', it.defensiveValue ? t('Sheet.DefShort') + ' +' + it.defensiveValue : ''].filter(Boolean).join(' · ')
  function renderItems(d) {
    const items = hero.get('data.items') || []
    const enc = d.encumbrance || {}, str = Number(d.strength ?? 0)
    const rec = (d.recap && d.recap.defense) || {}
    if (!diff('items', [ui.edit, last.status, items.map((it) => [it.name, it.quantity, it.equipped, it.itemType, it.weaponType, it.weaponDamage, it.armorDefenseFixed, it.uses, it.usesSpent]), enc.total, str, d.defenseValue, rec.armorName, rec.shieldName])) return
    const total = Number(enc.total ?? 0), dbl = Number(enc.double ?? 2 * str), over = str > 0 && total > str, heavy = str > 0 && total > dbl
    $('enc').className = 'enc' + (over ? ' over' : '')
    $('enc').innerHTML = `<span class="el">${esc(t('Character.Encumbrance'))}</span><span class="gauge wide"><i style="width:${str > 0 ? Math.min(100, Math.round(100 * total / str)) : 0}%"></i></span><b>${total} / ${str || '—'}${over ? ' · ' + esc(heavy ? t('Character.EncOverloaded') : t('Character.EncEncumbered')) : ''}</b>${over ? `<div class="encx sub">${esc(heavy ? t('Character.TooHeavy') : t('Character.Encumbered'))}</div>` : ''}`
    const row = (it, i) => {
      const can = equippable(it), eq = can && !!it.equipped, q = it.quantity ?? 1
      const qty = `<input type="number" class="qin" min="0" value="${q}" data-qi="${i}" aria-label="${esc(t('Character.Quantity'))}" title="${esc(t('Character.Quantity'))}"${off()}>`
      const ctl = can ? (eq ? `<button type="button" class="seal2" data-act="equip" data-i="${i}"${off()}>${esc(t('Sheet.Equipped'))}</button>` : `<button type="button" class="btn" data-act="equip" data-i="${i}"${off()}>${esc(t('Sheet.Equip'))}</button>`) : ''
      const uses = Number(it.uses) > 0 ? usesHTML(it.uses, it.usesSpent, `data.items[${i}].usesSpent`, it.name) : ''
      return `<div class="wp${eq ? ' eq' : ''}"><div class="wl">${ui.edit ? `<button type="button" class="del" data-act="remove" data-i="${i}" title="${esc(t('Sheet.Remove'))}"${off()}>✕</button>` : ''}
        ${ctl}${can ? ic(iconOf(it), 26) : ''}<span class="nm"><span class="lk" data-open="${i}">${esc(it.name || t('Entity.Item'))}</span><small>${esc(subText(it))}</small></span><span class="rg">${uses}${qty}</span></div></div>`
    }
    const eqIdx = [], bagIdx = []
    items.forEach((it, i) => (equippable(it) && it.equipped ? eqIdx : bagIdx).push(i))
    const byName = (a, b) => String(items[a].name || '').localeCompare(String(items[b].name || ''), 'fr', { sensitivity: 'base' })
    eqIdx.sort(byName); bagIdx.sort(byName)
    const defLine = d.defenseValue != null ? `<div class="defl">${esc(t('Characteristics.Defense'))} ${d.defenseValue}${rec.armorName || rec.shieldName ? '<em>' + [rec.armorName, rec.shieldName].filter(Boolean).map(esc).join(' + ') + '</em>' : ''}</div>` : ''
    $('items-eq').innerHTML = box(t('Sheet.Equipped'), defLine + (eqIdx.map((i) => row(items[i], i)).join('') || `<p class="empty">${esc(t('Sheet.NothingEquipped'))}</p>`))
    $('items-bag').innerHTML = box(t('Sheet.Tab.Bag'), bagIdx.map((i) => row(items[i], i)).join('') || `<p class="empty">${esc(t('Sheet.BagEmpty'))}</p>`)
    $('add-item').disabled = !online()
    document.querySelector('[data-panel=bag] [data-edit]').textContent = editLabel()
  }
  $('add-item').addEventListener('click', async () => {

  // détail des calculs : ce que le système a additionné pour chaque valeur (view.data.recap)
  function renderRecap(d) {
    const r = d.recap || {}
    const adj = (p) => hero.get('data.' + p)
    const rows = [
      ['str', 'Attributes.STR', 'strength', 'attrAdjust.STR', 'attr'], ['agi', 'Attributes.AGI', 'agility', 'attrAdjust.AGI', 'attr'],
      ['int', 'Attributes.INT', 'intellect', 'attrAdjust.INT', 'attr'], ['wil', 'Attributes.WIL', 'will', 'attrAdjust.WIL', 'attr'],
      ['perception', 'Characteristics.Perception', 'perceptionValue', 'perceptionAdjust', 'perception'], ['defense', 'Characteristics.Defense', 'defenseValue', 'defenseAdjust', 'defense'],
      ['health', 'Characteristics.Health', 'healthValue', 'healthAdjust', 'health'], ['speed', 'Characteristics.Speed', 'speedValue', 'speedAdjust', 'speed'],
      ['power', 'Characteristics.Power', 'powerValue', 'powerAdjust', 'power']]
    const rows2 = rows.map(([k, lk, vk, ap, kind]) => {
      const x = r[k] || {}, ov = adj(ap + '.override'), total = d[vk]
      const terms = [] // [valeur, origine]
      if (ov != null) terms.push([ov, t('Recap.Override')])
      else {
        if (x.base != null) {
          let lb
          if (adj(ap + '.base') != null) lb = t('Recap.Base')
          else if (kind === 'attr' || kind === 'speed') lb = t('Recap.Ancestry')
          else if (kind === 'perception') lb = t('Attributes.INT')
          else if (kind === 'defense') lb = r.defense && r.defense.armorName ? t('Characteristics.Armor') + ' : ' + r.defense.armorName : Number(d.pathGain && d.pathGain.defenseFixed) ? t('Recap.PathFixed') : d.ancestry && d.ancestry.defense != null ? t('Recap.Fixed') : t('Attributes.AGI')
          else if (kind === 'health') lb = d.healthAttribute ? EP.label('HealthAttribute', d.healthAttribute) : t('Recap.Base')
          else lb = t('Recap.Base')
          terms.push([x.base, lb])
        }
        const add = (v, lk) => { if (v != null && Number(v) !== 0) terms.push([Number(v), t(lk)]) }
        add(x.asc, kind === 'attr' ? 'Recap.AncestryBonus' : 'Recap.Ancestry')
        add(x.transf, 'Recap.Transformation'); add(x.levels, 'Recap.Levels'); add(x.paths, 'Recap.Paths')
        add(x.mods, 'Recap.Modifiers'); add(x.bonus, 'Recap.Bonus'); add(x.corr, 'Recap.CorruptionPenalty')
        if (kind === 'defense' && r.defense && Number(r.defense.shield)) terms.push([Number(r.defense.shield), r.defense.shieldName || t('Characteristics.Shield')])
      }
      const formula = terms.map(([v, o], i) => (i === 0 ? '' : Number(v) < 0 ? ' − ' : ' + ') + (i === 0 ? v : Math.abs(Number(v))) + ' (' + o + ')').join('')
      return [k, kind === 'x' ? '' : '= ' + (formula || '—')]
    })
    rows2.push(['healing', adj('healingAdjust.override') != null ? '= ' + adj('healingAdjust.override') + ' (' + t('Recap.Override') + ')' : '= ' + t('Sheet.Calc.Healing')])
    const html = JSON.stringify(rows2)
    if (diff('recap', [html])) rows2.forEach(([k, f]) => { const el = document.querySelector(`[data-fm="${k}"]`); if (el) el.textContent = f })
  }
