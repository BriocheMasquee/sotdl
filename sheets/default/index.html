          if (res != null) { vals[k] = res; cell.textContent = res; cell.classList.add('on') }
          else { cell.innerHTML = '<input type="number" class="rin" inputmode="numeric" placeholder="?">'; const inp = cell.querySelector('input'); inp.addEventListener('input', () => { vals[k] = inp.value === '' ? null : Number(inp.value); upd() }); inp.focus() }
          upd()
        }))
      })
      if (!r.value) return
      if (r.value === 'ok') { for (const k of keys) await hero.set(`data.attrAdjust.${k}.base`, vals[k]); await mark(st.key, tf('Sheet.Step.RollsDone', { a: keys.map((k) => `${t('Attributes.' + k)} ${vals[k]}`).join(' · ') }), { t: 'baseAttrs', k: keys }) }
      else await mark(st.key, t('Sheet.Step.FixedDone'), { t: 'none' })
    } else if (st.type === 'startRoll') {
      const v = await rollTotal(st.dice, t(st.stat === 'insanity' ? 'Characteristics.Insanity' : 'Characteristics.Corruption'), st.stat === 'insanity' ? 'Characteristics.Insanity' : 'Characteristics.Corruption'); if (v == null) return
      await hero.set(`data.${st.stat}.start`, v); await mark(st.key, `${st.label.split(' :')[0]} : ${v}`, { t: 'start', stat: st.stat })
    }
  }

  // fenêtre « Folie et corruption » : losanges jusqu'à la Volonté, démence, corruption, marque des ténèbres
  async function mindDialog() {
    let ins = Number(hero.get('view.data.insanityValue') ?? 0), cor = Number(hero.get('view.data.corruptionValue') ?? 0)
    const imax = hero.get('view.data.insanityMax') != null ? Number(hero.get('view.data.insanityMax')) : null
    const body = `<div class="mhead"><span class="ml">${esc(t('Characteristics.Insanity'))}</span><b id="md-n"></b></div><div class="dias big" id="md-d"></div>
      <div class="step" style="margin-top:12px"><span class="nm">${esc(t('Characteristics.Corruption'))}</span><button type="button" class="pm d" data-md="-1" aria-label="−1">−</button><b id="md-c"></b><button type="button" class="pm d" data-md="1" aria-label="+1">+</button></div>
      <label class="lbl" for="md-dem">${esc(t('Character.Dementia'))}</label><textarea id="md-dem" name="dem" rows="3">${esc(hero.get('data.dementia') || '')}</textarea>
      <label class="lbl" for="md-mark">${esc(t('Character.DarkMark'))}</label><textarea id="md-mark" name="mark" rows="4">${esc(hero.get('data.darkMark') || '')}</textarea>`
    const draw = (ov) => {
      ov.querySelector('#md-n').textContent = ins + (imax != null ? ' / ' + imax : '')
      ov.querySelector('#md-d').innerHTML = imax != null ? diamonds(ins, imax, true) : ''
      ov.querySelector('#md-c').textContent = cor
    }
    const r = await dialog(t('Sheet.Mind'), body, [{ label: t('Sheet.Cancel'), value: null }, { label: t('Sheet.Save'), value: 'ok', primary: true }], (ov) => {
      draw(ov)
      ov.addEventListener('click', (ev) => {
        const d = ev.target.closest('button[data-ins]')
        if (d) { const k = Number(d.dataset.ins); ins = k < ins ? k : k + 1; hero.set('data.insanity.current', ins).catch(fail); draw(ov); return }
        const m = ev.target.closest('button[data-md]')
        if (m) { cor = Math.max(0, cor + Number(m.dataset.md)); hero.set('data.corruption.current', cor).catch(fail); draw(ov) }
      })
    })
    if (r.value !== 'ok') return
    try {
      if (String(r.data.dem || '') !== String(hero.get('data.dementia') || '')) await hero.set('data.dementia', String(r.data.dem || ''))
      if (String(r.data.mark || '') !== String(hero.get('data.darkMark') || '')) await hero.set('data.darkMark', String(r.data.mark || ''))
    } catch (e) { fail(e) }
  }
  // pastilles : on retire des pastilles jusqu'à ce que tout (dont « +N » et « + Affliction ») tienne sur une seule ligne
  let badgeState = null
  const diamonds = (ins, imax, on) => Array.from({ length: imax }, (_, k) => `<button type="button" class="dia${k < ins ? ' on' : ''}" data-ins="${k}" aria-label="${esc(t('Characteristics.Insanity'))} ${k + 1}"${on ? '' : ' disabled'}></button>`).join('')
  const stepper = (k, lk, val, on, lab) => `<span class="meter">${lab(lk)}<button type="button" class="pm d sm" data-c="${k}" data-d="-1" aria-label="−1"${on ? '' : ' disabled'}>−</button><b class="big">${val}</b><button type="button" class="pm d sm" data-c="${k}" data-d="1" aria-label="+1"${on ? '' : ' disabled'}>+</button></span>`
  const badgesHTML = (st, shown, two, tight) => {
    const { ins, imax, cor, aff, connected, dem, mark } = st
    const dis = connected ? '' : ' disabled'
    const lab = (k) => `<button type="button" class="ml lk0" data-b="mind" title="${esc(t('Sheet.Mind'))}">${esc(t(k))}</button>`
    const gauge = (v, mx) => `<span class="gj" aria-hidden="true"><i style="width:${mx ? Math.min(100, Math.round(100 * v / mx)) : 0}%"></i></span>`
    const folie = imax != null && imax <= 10
      ? `<span class="meter">${lab('Characteristics.Insanity')}<span class="dias">${diamonds(ins, imax, connected)}</span><b>${ins}/${imax}</b></span>`
      : `<span class="meter">${lab('Characteristics.Insanity')}<button type="button" class="pm d sm" data-c="insanity" data-d="-1" aria-label="−1"${dis}>−</button>${gauge(ins, imax)}<b class="big">${ins}${imax != null ? '/' + imax : ''}</b><button type="button" class="pm d sm" data-c="insanity" data-d="1" aria-label="+1"${dis}>+</button></span>`
    const tag = (cls, on, lk, act, short) => `<button type="button" class="luck ${cls}${on ? ' on' : ''}" data-b="${act}"${act === 'luck' ? ` role="switch" aria-checked="${!!on}"${dis}` : ` title="${esc(t('Sheet.Mind'))}"`}><i></i>${esc(tight && short ? short : t(lk))}</button>`
    const middle = tag('', st.luck, 'Character.Luck', 'luck') + tag('dem', !!dem, 'Character.Dementia', 'mind') + tag('mark', !!mark, 'Character.DarkMark', 'mind', t('Sheet.MarksShort'))
    const pills = aff.map((a, i) => `<button type="button" class="aff" data-b="aff" data-i="${i}">${esc(a.name)}</button>`)
    return folie + '<span class="vr"></span>' + stepper('corruption', 'Characteristics.Corruption', cor, connected, lab) + '<span class="vr"></span>' + middle +
      (two ? '<span class="brk"></span>' : '<span class="vr"></span>') +
      pills.slice(0, shown).join('') +
      (pills.length > shown ? `<button type="button" class="aff more" data-b="aff-more" title="${esc(t('Sheet.AllPills'))}">+${pills.length - shown}</button>` : '') +
      `<button type="button" class="add" data-b="aff-add"${dis}>${esc(t('Sheet.AddAffliction'))}</button>`
  }
  // une seule ligne si tout tient ; sinon les afflictions passent sur une deuxième ligne (et sont réduites à « +N » si besoin)
  function fitBadges() {
    if (!badgeState) return
    const el = $('badges'), n = badgeState.aff.length
    const fits = (from, to) => { const kids = [...el.children].slice(from, to), top0 = kids[0].offsetTop; return !kids.some((k) => Math.abs(k.offsetTop - top0) > 6) }
    const set = (shown, two, tight) => { el.classList.toggle('tight', !!tight); el.innerHTML = badgesHTML(badgeState, shown, two, tight) }
    set(n, false, false)
    if (fits(0)) return
    for (const tight of [false, true]) {          // la ligne Folie / Corruption / pastilles doit tenir seule sur une ligne
      set(n, true, tight)
      const brk = [...el.children].findIndex((k) => k.classList.contains('brk'))
      if (fits(0, brk)) break
    }
    let shown = n
    for (;;) {
      set(shown, true, el.classList.contains('tight'))
      const brk = [...el.children].findIndex((k) => k.classList.contains('brk'))
      if (shown === 0 || fits(brk + 1)) break
      shown--
    }
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(fitBadges, 50))
  let rzTimer = null
  window.addEventListener('resize', () => { clearTimeout(rzTimer); rzTimer = setTimeout(fitBadges, 150) })

  // ===== RENDU =====
  let keys = {}
  const diff = (name, value) => { const k = JSON.stringify(value); if (keys[name] === k) return false; keys[name] = k; return true }

  function render(snap) {
    last = snap
    const v = snap.view, d = v.data || {}
    const connected = snap.status === 'connected'
    // portrait : image du personnage, sinon initiale
    const img = $('portrait')
    if (v.image) { const src = hero.resolvePath(v.image); if (img.getAttribute('src') !== src) img.src = src; img.hidden = false; img.classList.add('zoom'); $('portrait-i').hidden = true }
    else { img.hidden = true; $('portrait-i').hidden = false; text($('portrait-i'), (String(v.name || '?').trim()[0] || '?').toUpperCase()) }
    const origins = [d.ancestry && d.ancestry.name, d.transformation && d.transformation.name, d.novicePath && d.novicePath.name, d.expertPath && d.expertPath.name, d.masterPath && d.masterPath.name, d.secondPath && d.secondPath.name && `${d.secondPath.name} (${t('Sheet.SecondPathNote')})`].filter(Boolean)
    text($('origins'), origins.join(' · '))
    // niveau et bouton de montée de niveau
    text($('level-n'), d.level ?? 0)
    text($('lbl-level'), t('Character.Level'))
    const pend = pendingChoices(d)
    const lvHtml = (creating(d) ? '✎ ' + t('Sheet.Create.Button') : '▲ ' + t('Sheet.Step.Button')) + (pend ? `<em>${tf('Sheet.Step.Count', { n: pend })}</em>` : '')
    if ($('level-btn').dataset.k !== lvHtml) { $('level-btn').dataset.k = lvHtml; $('level-btn').innerHTML = lvHtml }
    $('level-btn').hidden = Number(d.level ?? 0) >= 10 && !pend && !creating(d)   // niveau 10 = maximum : plus de montée de niveau (sauf choix restant)
    $('level-btn').classList.toggle('hot', pend > 0)
    // jets
    ATTR.forEach(([k, valKey, modKey]) => {
      text(document.querySelector(`[data-v="${k}"]`), d[valKey] ?? '—')
      const b = document.querySelector(`[data-roll="${k}"]`)
      text(b, d[modKey] != null ? signed(d[modKey]) : '—'); b.disabled = d[valKey] == null || !connected
    })
    // caractéristiques
    const cell = (lk, val) => `<span class="ch"><span class="cl">${esc(t(lk))}</span><b>${esc(val ?? '—')}</b></span>`
    const sizeV = d.gabaritChoice ? EP.label('BodySize', d.gabaritChoice) : d.size
    const defCell = `<span class="ch def"><span class="cl">${esc(t('Characteristics.Defense'))}</span><span class="shield"><b>${esc(d.defenseValue ?? '—')}</b></span></span>`
    const sl = [cell('Characteristics.Size', sizeV), cell('Characteristics.Speed', d.speedValue), defCell, cell('Characteristics.Power', d.powerValue), cell('Characteristics.HealingRateShort', d.healingValue)].join('<span class="sep">◆</span>')
    if ($('stats').dataset.k !== sl) { $('stats').dataset.k = sl; $('stats').innerHTML = sl }
    // dégâts
    const cur = d.hp && d.hp.current, max = d.hp && d.hp.maximum
    const pct = max > 0 && cur != null ? Math.max(0, Math.min(100, (cur / max) * 100)) : 0
    $('hp-open').firstElementChild.style.width = pct + '%'
    $('hp-open').classList.toggle('down', d.healthState === 'down')
    text($('hp-text'), `${t('Characteristics.Damage')} ${cur ?? 0} / ${max ?? '—'}`)
    $('hp-down').hidden = d.healthState !== 'down'
    renderFate(d, connected)
    $('hp-minus').disabled = $('hp-plus').disabled = $('hp-open').disabled = !connected
    // folie (losanges : toucher en coche ou décoche), corruption, afflictions
    const aff = affList()
    const ins = Number(d.insanityValue ?? 0), cor = Number(d.corruptionValue ?? 0), imax = d.insanityMax != null ? Number(d.insanityMax) : null
    const luck = !!hero.get('data.luck'), dem = String(hero.get('data.dementia') || '').trim(), mark = String(hero.get('data.darkMark') || '').trim()
    if (diff('badges', [ins, imax, cor, luck, dem, mark, aff.map((a) => a.name), connected])) { badgeState = { ins, imax, cor, luck, dem, mark, aff, connected }; fitBadges() }
    renderWeapons(d); renderActions(d)
    { const tv = String(hero.get('data.turn') || 'none'), tb = $('turn'); tb.className = 'tchip ' + tv; tb.disabled = !connected; text(tb, tv === 'fast' ? '⚡ ' + t('TurnType.Fast') : tv === 'slow' ? '⏳ ' + t('TurnType.Slow') : t('TurnType.None')) }
    const heal = d.healingValue
    text($('rest-8-sub'), heal != null ? tf('Sheet.RestHeals', { n: heal }) : '')
    text($('rest-24-sub'), heal != null ? tf('Sheet.RestHeals', { n: heal * 2 }) : '')
    $('rest-8').disabled = $('rest-24').disabled = !connected || heal == null
    renderMagic(d); renderTalents(d); renderItems(d); renderPerso(d)
    if (!connected) status.textContent = t('Sheet.Offline')
    else if (snap.pending) status.textContent = t('Sheet.Saving')
    else if (/^(Hors connexion|Enregistrement)/.test(status.textContent)) status.textContent = ''
    if (!ui.autoCreate && connected && creating(d) && !(d.ancestry && d.ancestry.name)) { ui.autoCreate = true; ui.drawer = true }
    if (connected) checkLevel(d)
    if (ui.drawer) {
      const ov = $('overlay')
      if (!ov.querySelector('.dlg')) { const sc = ov.querySelector('.drawer'); const top = sc ? sc.scrollTop : 0; ov.innerHTML = ''; renderDrawer(); const nd = ov.querySelector('.drawer'); if (nd) nd.scrollTop = top }
    }
  }

  hero.subscribe(render)
  loadAfflictions().then(() => rerender())
  { const op = new URLSearchParams(location.search).get('open'); if (op === 'mind') setTimeout(() => mindDialog(), 300); else if (op === 'aff') setTimeout(() => afflictionDialog(), 300) }
  $('loading').hidden = true
  $('sheet').hidden = false
})()
</script>
</body>
</html>
